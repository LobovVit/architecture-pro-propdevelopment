apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: audit-zone
spec:
  containers:
    - name: nginx
      image: nginx:stable
      volumeMounts:
        - name: host-etc
          mountPath: /host-etc
  volumes:
    - name: host-etc
      hostPath:
        path: /etc
        type: Directory
